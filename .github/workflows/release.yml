name: Build and publish release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (leave blank is not supported)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.sha || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and test
        run: gradle clean test build --no-daemon
      - name: Determine and validate release tag
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = ['\\"]\\([^'\\"]*\\)['\\"].*/\\1/p" build.gradle | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read project version from build.gradle"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/master" ]]; then
            # Every master push gets a unique release tag, including merge commits.
            RELEASE_TAG="v${VERSION}-build.${RUN_NUMBER}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            RELEASE_TAG="$REF_NAME"
          fi

          if [[ "$RELEASE_TAG" != "v$VERSION" && "$RELEASE_TAG" != "v$VERSION-build."* ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must be v$VERSION or v$VERSION-build.N"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG from $COMMIT_SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CMDLoggerIntegration ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/*.jar
