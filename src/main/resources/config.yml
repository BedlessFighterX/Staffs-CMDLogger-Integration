webhook-url: 'your-webhook-url'

redact-all-arguments: true

log-console-commands: false

ignored-players: []

embed:
  title: 'Staff Command Audit'
  color: '#5865F2'
  server-name: 'Minecraft Server'
  show-server: true
  show-world: true
  show-timestamp: true
  show-operator-status: true

ignored-commands:
  - 'examplecommand1'

redacted-commands:
  - 'login'
  - 'register'
  - 'l'
  - 'log'
  - 'changepassword'
  - 'changepass'
  - 'resetpassword'
  - 'auth'
  - 'token'
  - 'password'
  - 'passwd'
  - '2fa'
  - 'totp'
  - 'email'
  - 'verify'
  - 'pin'
