name: CMDLoggerIntegration
version: '3.1.0'
main: com.infinity.cmdloggerintegration.CMDLoggerIntegration
api-version: '1.21'
load: POSTWORLD
author: BedlessFighterX
website: https://github.com/BedlessFighterX/Staffs-CMDLogger-Integration
description: Secure, configurable staff command auditing with Discord embeds.
commands:
  cmdlogger:
    description: View information, reload configuration, or inspect audit status.
    usage: /cmdlogger [help|reload|status|diagnostics]
    permission: cmdlogger.use
permissions:
  cmdlogger.staff:
    description: Commands executed by this player are sent to the configured staff audit channel.
    default: op
  cmdlogger.use:
    description: Allows use of the CMDLogger command.
    default: true
  cmdlogger.admin:
    description: Allows reloading configuration and viewing plugin diagnostics.
    default: op
