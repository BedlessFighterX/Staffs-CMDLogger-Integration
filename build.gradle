plugins {
    id 'java'
}

group = 'com.infinity'
version = '3.3.0'

def targetApiVersion = providers.gradleProperty('serverApiVersion').getOrElse('1.8.8')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.current()
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:${targetApiVersion}-R0.1-SNAPSHOT"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile).configure {
    options.release = 8
}

tasks.named('compileTestJava', JavaCompile).configure {
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
    maxParallelForks = 1
}

jar {
    archiveBaseName = 'CMDLoggerIntegration'
    manifest {
        attributes(
            'Implementation-Title': 'CMDLoggerIntegration',
            'Implementation-Version': project.version,
            'Minecraft-API-Tested': targetApiVersion
        )
    }
}
