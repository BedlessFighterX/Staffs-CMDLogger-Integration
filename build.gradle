plugins {
    id 'java'
}

group = 'com.infinity'
version = '3.3.0'

def targetApiVersion = providers.gradleProperty('serverApiVersion').getOrElse('1.8.8')
def modernCalendarVersion = targetApiVersion.startsWith('26.')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    if (modernCalendarVersion) {
        compileOnly "io.papermc.paper:paper-api:${targetApiVersion}-R0.1-SNAPSHOT"
    } else {
        compileOnly "org.spigotmc:spigot-api:${targetApiVersion}-R0.1-SNAPSHOT"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep output loadable on Java 8 servers while building with a modern JDK.
    options.release = 8
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'CMDLoggerIntegration'
    manifest {
        attributes(
            'Implementation-Title': 'CMDLoggerIntegration',
            'Implementation-Version': project.version,
            'Minecraft-API-Tested': targetApiVersion
        )
    }
}
